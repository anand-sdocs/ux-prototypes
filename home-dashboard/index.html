<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - S-Docs Home Dashboard Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Prototype-only: flip between the admin and non-admin home page -->
  <div class="proto-toolbar">
    <span class="proto-toolbar-badge">Prototype</span>
    <label>View as</label>
    <div class="seg" id="role-toggle">
      <button data-role="admin">Admin</button>
      <button data-role="user">User</button>
    </div>
    <span class="proto-toolbar-hint">Admins see workspace-wide metrics and every activity type; users see their own requests.</span>
  </div>

  <header class="app-header">
    <div class="header-left">
      <div class="sdocs-logo" id="logo-home" title="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0176d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span class="logo-wordmark">s-docs</span>
      </div>
      <span class="badge-enterprise">ENTERPRISE</span>

      <button class="header-ws-pill" id="header-ws-pill" title="Switch workspace"></button>

      <nav class="main-nav">
        <span class="nav-link active">Home</span>
        <span class="nav-link" data-href="signature-requests.html">Signature requests</span>
        <span class="nav-link">Documents</span>
        <span class="nav-link">Templates</span>
        <span class="nav-link">Settings</span>
      </nav>
    </div>
    <div class="header-right">
      <div class="help-btn-wrap">
        <button class="header-icon-btn" title="Help">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </button>
        <button class="header-icon-btn" style="width:16px;" title="Help menu">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>

      <div class="avatar-circle" id="avatar-btn"></div>

      <div class="user-dropdown" id="user-dropdown">
        <div class="dropdown-user-block">
          <div class="dropdown-user-name" id="dd-user-name"></div>
          <div class="dropdown-user-email" id="dd-user-email"></div>
        </div>
        <div class="dropdown-ws-block" id="dropdown-ws-block"></div>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" id="btn-switch-workspace">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"></path><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><path d="M7 23l-4-4 4-4"></path><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
          Switch workspace
        </button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item danger" id="btn-sign-out">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Sign out
        </button>
      </div>
    </div>
  </header>

  <div class="page-body">
    <h1 class="home-greeting" id="greeting"></h1>
    <p class="home-sub" id="greeting-sub"></p>

    <div class="home-grid">
    <!-- Metrics + chart -->
    <section class="panel">
      <div class="panel-head panel-head-controls">
        <div class="panel-controls">
          <select class="select-btn" id="period-select" aria-label="Time frame">
            <option value="7">Last 7 days</option>
            <option value="15">Last 15 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="year">This year</option>
          </select>
        </div>
      </div>
      <div class="kpi-row" id="kpi-row"></div>
      <div class="chart-wrap" id="chart-wrap">
        <div class="chart-legend">
          <span><i style="background:#0176d3"></i>Sent</span>
          <span><i style="background:#2e7d32"></i>Completed</span>
        </div>
        <svg class="chart-svg" id="chart" role="img" aria-label="Sent and completed requests over time"></svg>
        <div class="chart-tip" id="chart-tip"></div>
      </div>
    </section>

    <!-- Activity feed: right rail, scrolls within the height of the overview -->
    <section class="panel feed-panel">
      <div class="feed-inner">
      <div class="panel-head">
        <div>
          <div class="panel-title">Recent activity</div>
          <div class="panel-caption" id="feed-caption"></div>
        </div>
        <div class="panel-controls">
          <select class="select-btn" id="feed-period" aria-label="Activity time frame">
            <option value="2">Last 2 days</option>
            <option value="7">Last 7 days</option>
            <option value="15">Last 15 days</option>
          </select>
        </div>
      </div>
      <div class="chip-row" id="feed-chips"></div>
      <div class="feed-scroll">
        <ul class="feed-list" id="feed-list"></ul>
      </div>
      </div>
    </section>
    </div>
  </div>

  <!-- Switch Workspace Modal -->
  <div class="modal-overlay" id="switch-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3>Switch workspace</h3>
        <button class="modal-close" id="modal-close-x">&times;</button>
      </div>
      <div class="modal-body">
        <div class="workspace-list" id="modal-workspace-list"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="session.js"></script>
  <script src="schema.js"></script>
  <script src="data.js"></script>
  <script src="chrome.js"></script>
  <script src="home.js"></script>
</body>
</html>
