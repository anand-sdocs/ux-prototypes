<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a Workspace - S-Docs Workspace Switcher Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="picker-header">
    <div class="sdocs-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0176d3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
      </svg>
      <span class="logo-wordmark">s-docs</span>
    </div>
    <button class="link-btn" id="btn-sign-out">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      Sign out
    </button>
  </header>

  <main class="picker-page">
    <div class="picker-content">
      <h1>Choose a workspace</h1>
      <p class="picker-subtitle" id="picker-subtitle"></p>

      <div class="workspace-list" id="workspace-list"><!-- injected --></div>

      <p class="picker-footer-note">Wrong account? <a href="index.html" id="switch-account-link" style="color: var(--primary-color); font-weight:600; text-decoration:none;">Sign in with a different account</a></p>
    </div>
  </main>

  <script src="session.js"></script>
  <script src="schema.js"></script>
  <script src="workspace-select.js"></script>
</body>
</html>
