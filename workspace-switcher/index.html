<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - S-Docs Workspace Switcher Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Prototype-only control: lets the demoer pick which identity signs in,
       so both the multi-workspace (picker shown) and single-workspace
       (straight into the app) paths can be demonstrated. -->
  <div class="proto-toolbar">
    <span class="proto-toolbar-badge">Prototype Control</span>
    <label for="scenario-select">Sign in as:</label>
    <select id="scenario-select">
      <option value="multi">anarasimhan@sdocs.com &mdash; linked to 3 workspaces</option>
      <option value="single">jordan.lee@singletoninc.com &mdash; linked to 1 workspace</option>
    </select>
    <span class="proto-toolbar-hint">In production the email is whatever the IdP returns &mdash; this just lets the demo show both outcomes.</span>
  </div>

  <div class="login-page">
    <div class="login-card">
      <h1>Sign up for S-Docs</h1>

      <button class="oauth-btn" id="btn-google">
        <span class="oauth-icon">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29A11.95 11.95 0 0 0 0 12c0 1.93.46 3.76 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.94 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
        </span>
        <span>Continue with Google</span>
      </button>

      <button class="oauth-btn" id="btn-microsoft">
        <span class="oauth-icon">
          <svg viewBox="0 0 24 24" width="18" height="18"><rect x="1" y="1" width="10" height="10" fill="#F25022"/><rect x="13" y="1" width="10" height="10" fill="#7FBA00"/><rect x="1" y="13" width="10" height="10" fill="#00A4EF"/><rect x="13" y="13" width="10" height="10" fill="#FFB900"/></svg>
        </span>
        <span>Continue with Microsoft</span>
      </button>

      <div class="login-status" id="login-status">
        <span class="mini-spinner"></span>
        <span id="login-status-text">Signing you in&hellip;</span>
      </div>
    </div>
  </div>

  <script src="session.js"></script>
  <script src="schema.js"></script>
  <script src="login.js"></script>
</body>
</html>
