<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connection Successful - Identity Provider</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, #001c57 0%, #00297a 45%, #0c3fa8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      padding: 36px 34px;
      text-align: center;
    }
    .check-circle {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: #1a7f37;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
    }
    .check-circle svg { width: 26px; height: 26px; color: #fff; }
    h1 { font-size: 19px; font-weight: 700; color: #1d2226; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #6e7b85; margin-bottom: 22px; line-height: 1.5; }
    .claims-box {
      text-align: left;
      background: #f6f8fb;
      border: 1px solid #e3e8ef;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 22px;
    }
    .claims-title {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #6e7b85;
      margin-bottom: 10px;
    }
    .claim-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12.5px;
      padding: 6px 0;
      border-top: 1px solid #e3e8ef;
    }
    .claim-row:first-of-type { border-top: none; }
    .claim-key { color: #4a5568; font-weight: 600; }
    .claim-value { color: #1d2226; font-family: 'SFMono-Regular', Consolas, monospace; }
    .footer-note { font-size: 10.5px; color: #9aa5b1; line-height: 1.5; margin-top: 4px; }
    .btn-close {
      display: inline-block;
      margin-top: 6px;
      background: #1662dd;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-close:hover { background: #0f4bb8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
    </div>
    <h1>Connection Successful</h1>
    <p class="sub" id="app-sub">The OpenID Connect handshake completed and the identity provider returned the following claims.</p>

    <div class="claims-box">
      <div class="claims-title">Claims returned</div>
      <div id="claims-list"></div>
    </div>

    <button class="btn-close" id="btn-close">Done</button>
    <p class="footer-note">This is a simulated response for prototyping purposes. Close this tab to return to Settings.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const appName = params.get('app') || 'S-Docs E-Signature';
    document.getElementById('app-sub').textContent =
      `The OpenID Connect handshake with ${appName} completed and the identity provider returned the following claims.`;

    let attrs = [];
    try { attrs = JSON.parse(params.get('attrs') || '[]'); } catch (e) { attrs = []; }

    const mockValues = {
      certSerialNumber: 'SN-4471-2298-AB',
      certificateSerialNumber: 'SN-4471-2298-AB',
      name: 'Jordan Alvarez',
      fullName: 'Jordan Alvarez',
      email: params.get('email') || 'jordan.alvarez@example.com',
      sub: 'okta_00u1a2b3c4d5e6f7g8h9'
    };

    const list = document.getElementById('claims-list');
    const mapped = attrs.filter(a => a.claim);

    if (mapped.length === 0) {
      list.innerHTML = '<div class="claim-row"><span class="claim-key">sub</span><span class="claim-value">' + mockValues.sub + '</span></div>';
    } else {
      mapped.forEach(a => {
        const value = mockValues[a.claim] || 'sample-value-' + Math.random().toString(36).slice(2, 8);
        const row = document.createElement('div');
        row.className = 'claim-row';
        row.innerHTML = `<span class="claim-key">${a.label || a.claim} <span style="color:#9aa5b1;font-weight:400;">(${a.claim})</span></span><span class="claim-value">${value}</span>`;
        list.appendChild(row);
      });
    }

    document.getElementById('btn-close').addEventListener('click', () => window.close());
  </script>
</body>
</html>
