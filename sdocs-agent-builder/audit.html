<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit trail - S-Docs Agent Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Prototype-only control -->
  <div class="proto-toolbar">
    <span class="proto-toolbar-badge">Prototype</span>
    <span class="proto-toolbar-hint">Mock data only &mdash; no real agents, integrations, or AI calls are made in this prototype.</span>
  </div>

  <header class="app-header">
    <div class="brand"><svg class="brand-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="6,6 40,6 54,30 40,54 6,54 20,30" fill="#f2793c"/><polygon points="56,48 56,18 76,4 96,18 96,48 76,34" fill="#8b6fe8"/><rect x="6" y="58" width="40" height="36" rx="4" fill="#2f8fe0"/><rect x="54" y="58" width="42" height="36" rx="4" fill="#6fbf73"/></svg> S-Docs Agent Platform</div>
    <div class="header-actions">
      <a class="btn btn-outline btn-sm" href="index.html">Dashboard</a>
      <a class="btn btn-outline btn-sm" href="skills.html">Skills</a>
      <div class="agent-avatar" style="border-radius:50%;">AN</div>
    </div>
  </header>

  <main class="dashboard audit-page">

    <a class="audit-back-link" href="index.html">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="15 18 9 12 15 6"/></svg>
      Back to dashboard
    </a>

    <div class="audit-heading card" id="audit-heading"></div>

    <div class="audit-grid">
      <div class="card audit-flow-card">
        <div class="card-head">
          <h3>Execution flow</h3>
          <span class="card-sub">Click a step for details</span>
        </div>
        <div class="audit-flow-canvas" id="audit-flow-canvas"></div>
      </div>

      <div class="card audit-detail-card" id="audit-detail-card">
        <!-- filled by audit.js -->
      </div>
    </div>

  </main>

  <!-- Printable, full-detail render used only for the "Download PDF" flow (window.print). Hidden on screen. -->
  <div id="audit-print-doc" class="audit-print-doc"></div>

  <script src="schema.js"></script>
  <script src="audit.js"></script>
</body>
</html>
