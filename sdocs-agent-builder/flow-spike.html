<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JointJS flow spike &mdash; Agent Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@joint/core@4.3.3/dist/joint.css">
  <link rel="stylesheet" href="flow-spike.css">
</head>
<body class="spike-body">

  <div class="proto-toolbar">
    <span class="proto-toolbar-badge">Spike</span>
    <span class="proto-toolbar-hint">Throwaway JointJS evaluation &mdash; free <code>@joint/core</code> (MPL-2.0), no build step. Not wired into the builder.</span>
  </div>

  <header class="spike-header">
    <div class="spike-header-left">
      <svg class="brand-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="6,6 40,6 54,30 40,54 6,54 20,30" fill="#f2793c"/><polygon points="56,48 56,18 76,4 96,18 96,48 76,34" fill="#8b6fe8"/><rect x="6" y="58" width="40" height="36" rx="4" fill="#2f8fe0"/><rect x="54" y="58" width="42" height="36" rx="4" fill="#6fbf73"/></svg>
      <span class="spike-title">Tasks &amp; decisions</span>
      <span class="spike-subtitle">How this agent decides what to do</span>
    </div>
    <div class="spike-header-right">
      <button class="btn btn-outline btn-sm" id="btn-zoom-out" title="Zoom out">&minus;</button>
      <span class="spike-zoom-label" id="zoom-label">100%</span>
      <button class="btn btn-outline btn-sm" id="btn-zoom-in" title="Zoom in">+</button>
      <button class="btn btn-outline btn-sm" id="btn-fit">Fit</button>
      <button class="btn btn-outline btn-sm" id="btn-relayout">Re-layout</button>
      <button class="btn btn-outline btn-sm" id="btn-undo" title="Undo">Undo</button>
    </div>
  </header>

  <main class="spike-main">
    <div class="spike-canvas-wrap">
      <div class="spike-paper" id="paper"></div>
      <div class="spike-minimap">
        <div class="spike-minimap-label">Overview</div>
        <div class="spike-minimap-paper" id="minimap"></div>
      </div>
      <div class="spike-legend" id="legend"></div>
    </div>

    <aside class="spike-inspector" id="inspector"></aside>
  </main>

  <div class="spike-insert-menu" id="insert-menu"></div>

  <script src="https://cdn.jsdelivr.net/npm/@dagrejs/graphlib@2.2.4/dist/graphlib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@dagrejs/dagre@3.1.1/dist/dagre.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@joint/core@4.3.3/dist/joint.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@joint/layout-directed-graph@4.3.0/dist/DirectedGraph.min.js"></script>
  <script src="schema.js"></script>
  <script src="flow-spike.js"></script>
</body>
</html>
