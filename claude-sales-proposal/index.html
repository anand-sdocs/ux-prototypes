<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S-Docs Proposal Agent in Claude - UX Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&family=Copernicus:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="proto-toolbar">
    <span class="proto-toolbar-badge">Prototype</span>
    <span class="proto-toolbar-hint">A simulated Claude.ai chat &mdash; no real Claude, S-Docs, or MCP tool calls are made.</span>
  </div>

  <div class="claude-app">
    <aside class="claude-sidebar">
      <div class="claude-sidebar-top">
        <div class="claude-logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z" fill="currentColor"/></svg>
        </div>
        <span class="claude-wordmark">Claude</span>
      </div>

      <button class="claude-new-chat-btn" id="new-chat-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New chat
      </button>

      <div class="claude-sidebar-section">Recents</div>
      <div id="past-chat-list"></div>

      <div class="claude-sidebar-bottom">
        <div class="claude-sidebar-user">
          <div class="claude-avatar-circle">AN</div>
          <div>
            <div class="claude-sidebar-user-name">Anand Narasimhan</div>
            <div class="claude-sidebar-user-email">anarasimhan@sdocs.com</div>
          </div>
        </div>
      </div>
    </aside>

    <main class="claude-main">
      <header class="claude-topbar">
        <div class="claude-model-pill">
          Claude Sonnet 5
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="claude-connector-pill" id="connector-pill" title="S-Docs is connected via MCP">
          <span class="connector-dot"></span> Connectors &middot; 1 active
        </div>
      </header>

      <div class="claude-thread" id="thread"></div>

      <div class="claude-composer">
        <div class="claude-composer-box">
          <textarea class="claude-composer-input" id="composer-input" rows="1" placeholder="Reply to Claude..."></textarea>
          <div class="claude-composer-row">
            <button class="claude-composer-tool-btn" title="Attach">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <button class="claude-send-btn" id="send-btn" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M4 12l16-8-4 8 4 8-16-8z"/></svg>
            </button>
          </div>
        </div>
        <div class="claude-composer-hint">Claude can make mistakes. This is a UX prototype &mdash; nothing here is real.</div>
      </div>
    </main>
  </div>

  <script src="schema.js"></script>
  <script src="app.js"></script>
</body>
</html>
