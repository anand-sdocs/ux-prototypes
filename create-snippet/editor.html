<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled Snippet - S-Docs Create Snippet Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="editor-header">
    <div class="editor-doc-info">
      <div class="editor-title-row">
        <span class="editor-title" id="editor-title" contenteditable="true" spellcheck="false">Untitled Snippet</span>
        <span class="badge-draft">Draft</span>
        <span class="badge-snippet">Snippet</span>
      </div>
      <div class="editor-subtitle">No primary data source &bull; Uses Runtime &amp; custom variables &bull; Last saved just now</div>
    </div>
    <div class="editor-header-right">
      <button class="btn btn-text">Take a tour</button>
      <button class="btn btn-text">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        Help
      </button>
      <button class="btn">Preview</button>
      <button class="btn btn-primary" id="btn-publish">Publish snippet</button>
    </div>
  </header>

  <div class="rte-toolbar">
    <select class="rte-select"><option>sans-serif</option></select>
    <select class="rte-select"><option>13</option></select>
    <div class="rte-divider"></div>
    <button class="rte-icon-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 4h8a4 4 0 0 1 0 8H6zM6 12h9a4 4 0 0 1 0 8H6z"></path></svg></button>
    <button class="rte-icon-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="4" x2="10" y2="4"></line><line x1="14" y1="4" x2="9" y2="20"></line><line x1="5" y1="20" x2="14" y2="20"></line></svg></button>
    <button class="rte-icon-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 3v7a6 6 0 0 0 12 0V3"></path><line x1="4" y1="21" x2="20" y2="21"></line></svg></button>
    <div class="rte-divider"></div>
    <button class="rte-icon-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="17" y1="10" x2="3" y2="10"></line><line x1="21" y1="6" x2="3" y2="6"></line><line x1="21" y1="14" x2="3" y2="14"></line><line x1="17" y1="18" x2="3" y2="18"></line></svg></button>
    <button class="rte-icon-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg></button>
  </div>

  <div class="app-body">

    <aside class="slim-navbar">
      <div class="nav-item" id="nav-elements" title="Elements">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </div>
      <div class="nav-item" id="nav-draw" title="Draw">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"></path></svg>
      </div>
      <div class="nav-item active" id="nav-data" title="Data">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      </div>
      <div class="nav-item" id="nav-outline" title="Outline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
      </div>
    </aside>

    <!-- Data panel -->
    <aside class="left-panel" id="panel-data">
      <div class="panel-header">Data</div>
      <div class="type-filter-bar" id="type-filter-bar"></div>
      <div class="panel-search">
        <input type="text" id="field-search" placeholder="Search fields...">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </div>
      <div class="panel-scroll">

        <div class="data-accordion" id="accordion-runtime">
          <div class="data-accordion-header" id="header-runtime">
            <div class="data-accordion-header-left">
              <svg class="data-accordion-chevron expanded" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"></polyline></svg>
              Runtime
            </div>
          </div>
          <div class="data-accordion-body expanded" id="body-runtime"></div>
        </div>

        <div class="data-accordion" id="accordion-variables">
          <div class="data-accordion-header" id="header-variables">
            <div class="data-accordion-header-left">
              <svg class="data-accordion-chevron expanded" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="9 18 15 12 9 6"></polyline></svg>
              Variables
            </div>
          </div>
          <div class="data-accordion-body expanded" id="body-variables">
            <div class="add-variable-link" id="btn-add-variable">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Add new variable
            </div>
            <div id="custom-fields-list"></div>
          </div>
        </div>

      </div>
    </aside>

    <!-- Canvas -->
    <main class="editor-workspace">
      <div class="canvas-container">
        <div class="doc-page" id="doc-page">
          <svg class="doc-lock-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>

          <div class="canvas-body" id="canvas-body" contenteditable="true" spellcheck="false"></div>
        </div>
      </div>
    </main>

  </div>

  <!-- @-mention floating menu (portal) -->
  <div class="mention-menu" id="mention-menu">
    <div class="mention-menu-header">Insert a variable</div>
    <div id="mention-list"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="schema.js"></script>
  <script src="editor.js"></script>
</body>
</html>
