<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Illustrations — SVG conversion</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f7f6; color: #1f3a3d; }
  header { padding: 24px 32px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p.sub { margin: 0; color: #5a7a7d; font-size: 14px; }
  .row { display: flex; gap: 24px; padding: 0 32px 40px; flex-wrap: wrap; }
  .panel { background: #fff; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 16px; flex: 1; min-width: 340px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: #3d6d72; text-transform: uppercase; letter-spacing: 0.04em; }
  .panel img, .panel object, .panel svg { width: 100%; height: auto; display: block; }
  .frame { border: 1px dashed #cfe0de; border-radius: 8px; overflow: hidden; }
</style>
</head>
<body>
  <header>
    <h1>Illustrations Prototype</h1>
    <p class="sub">Original raster reference vs. hand-converted SVG (fully vector, animatable).</p>
  </header>
  <div class="row">
    <div class="panel">
      <h2>SVG conversion</h2>
      <div class="frame">
        <img src="illustration.svg" alt="SVG illustration" />
      </div>
    </div>
  </div>
</body>
</html>
