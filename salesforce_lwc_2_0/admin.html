<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S-Docs LWC 2.0 Walkthrough</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6">
  <link rel="stylesheet" href="admin.css?v=8">
</head>
<body>

<!-- ============ SALESFORCE GLOBAL HEADER ============ -->
<header class="sf-global-header">
  <div class="ghl">
    <button class="gh-icon-btn" title="Menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <span class="org-pill">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      Scratch Org
    </span>
  </div>
  <div class="ghc">
    <div class="gh-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.6" y2="16.6"/></svg>
      <input type="text" placeholder="Search..." aria-label="Search">
    </div>
  </div>
  <div class="ghr">
    <button class="gh-icon-btn" title="Help"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a3 3 0 0 1 5.6 1.2c0 2-2.8 2.4-2.8 4"/><circle cx="12" cy="17.3" r="0.9" fill="currentColor" stroke="none"/></svg></button>
    <button class="gh-icon-btn" title="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
    <span class="persona-chip" id="persona-chip" hidden></span>
    <span class="avatar"></span>
  </div>
</header>

<!-- ============ APP NAV BAR ============ -->
<div class="sf-app-nav">
  <button class="waffle" title="App Launcher">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="2.5" cy="2.5" r="1.5"/><circle cx="8" cy="2.5" r="1.5"/><circle cx="13.5" cy="2.5" r="1.5"/><circle cx="2.5" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13.5" cy="8" r="1.5"/><circle cx="2.5" cy="13.5" r="1.5"/><circle cx="8" cy="13.5" r="1.5"/><circle cx="13.5" cy="13.5" r="1.5"/></svg>
  </button>
  <span class="app-name" id="app-name">S-Docs</span>
  <div class="tabset" id="app-tabs">
    <div class="nav-tab">Home</div>
    <div class="nav-tab">S-Docs Templates</div>
    <div class="nav-tab">Documents</div>
    <div class="nav-tab active">S-Docs Cards</div>
    <div class="nav-tab">Settings</div>
  </div>
</div>

<!-- ============ PAGE (rendered by admin.js) ============ -->
<main class="ad-page" id="ad-app"></main>

<!-- ============ SHARED OVERLAYS ============ -->
<div class="sd-menu" id="ad-menu" hidden role="menu"></div>

<div class="sd-backdrop" id="ad-backdrop" hidden></div>
<div class="sd-modal" id="ad-modal" hidden role="dialog" aria-modal="true" aria-labelledby="ad-modal-title">
  <div class="sd-modal-head">
    <h2 id="ad-modal-title"></h2>
    <button class="sd-modal-x" id="ad-modal-x" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
  </div>
  <div class="sd-modal-body" id="ad-modal-body"></div>
  <div class="sd-modal-foot" id="ad-modal-foot"></div>
</div>

<div class="sd-toast-stack" id="ad-toasts" aria-live="polite"></div>

<script src="admin.js?v=11"></script>
<script src="tour.js?v=7"></script>
</body>
</html>
