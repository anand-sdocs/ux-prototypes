<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Apps - Okta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="okta-body">
  <header class="okta-dash-header">
    <span class="org">S-Docs</span>
    <div class="search">Search your apps</div>
    <span style="flex:1"></span>
    <label style="font-size:12.5px; color:#6e6e78;">Signed in to Okta as
      <select id="who" class="input" style="width:auto; display:inline-block; padding:5px 8px; margin-left:6px;"></select>
    </label>
  </header>
  <div class="okta-dash">
    <h2>My Apps</h2>
    <div class="tile-grid" id="tiles"></div>
    <p style="font-size:12px; color:#6e6e78; margin-top:26px;">Clicking the S-Docs tile starts IdP-initiated SSO: Okta posts a signed SAML response straight to S-Docs without S-Docs asking first.</p>
  </div>
  <script src="shared.js"></script>
  <script>
    const who = document.getElementById('who');
    who.innerHTML = OKTA_USERS.map(u => `<option value="${u.email}">${u.first} ${u.last} (${u.email})</option>`).join('');

    const apps = [
      { name: 'S-Docs', logo: LOGO_SVG.replace('width="30" height="30"', 'width="44" height="44"'), sdocs: true },
      { name: 'Slack', logo: '<div style="width:40px;height:40px;border-radius:8px;background:#4a154b;color:#fff;display:grid;place-items:center;font-weight:700;">S</div>' },
      { name: 'Salesforce', logo: '<div style="width:52px;height:36px;border-radius:18px;background:#00a1e0;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;">sf</div>' },
      { name: 'Google Workspace', logo: '<div style="width:40px;height:40px;border-radius:8px;background:#fff;border:1px solid #ddd;display:grid;place-items:center;font-weight:700;color:#4285f4;">G</div>' },
      { name: 'Zoom', logo: '<div style="width:40px;height:40px;border-radius:10px;background:#2d8cff;color:#fff;display:grid;place-items:center;font-weight:700;">Z</div>' },
      { name: 'Jira', logo: '<div style="width:40px;height:40px;border-radius:8px;background:#0052cc;color:#fff;display:grid;place-items:center;font-weight:700;">J</div>' }
    ];
    document.getElementById('tiles').innerHTML = apps.map((a, i) => `
      <div class="app-tile ${a.sdocs ? 'highlight' : ''}" data-i="${i}">
        ${a.sdocs ? '<span class="new-tag">NEW</span>' : ''}
        <div class="tile-logo">${a.logo}</div>
        <div class="tile-name">${a.name}</div>
      </div>`).join('');
    document.querySelectorAll('.app-tile').forEach(t => t.onclick = () => {
      const app = apps[+t.dataset.i];
      if (!app.sdocs) { toast(`${app.name} isn't part of this prototype`); return; }
      t.innerHTML = '<div class="tile-logo"><div class="spinner" style="width:24px;height:24px;border-width:3px;border-top-color:#1662dd;"></div></div><div class="tile-name">Opening S-Docs…</div>';
      setTimeout(() => { location.href = `acs.html?flow=idp&email=${encodeURIComponent(who.value)}`; }, 900);
    });
    renderToolbar('okta-dashboard.html', 'IdP-initiated: user starts at Okta');
  </script>
</body>
</html>
