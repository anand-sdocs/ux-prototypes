<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <a href="admin.html" class="active"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.5"/></svg>Single sign-on<span class="new-pill">NEW</span></a>

        <span id="status-pill"></span>
        <div class="actions" id="title-actions"></div>

      <div id="content"></div>

  <div class="modal-backdrop" id="modal">
    <div class="modal">
      <h4 id="modal-title"></h4>
      <p id="modal-body"></p>
      <div class="footer">
        <button class="btn" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="admin.js"></script>
