<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S-Docs Proposal Agent in Teams - UX Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="proto-toolbar">
    <span class="proto-toolbar-badge">Prototype</span>
    <span class="proto-toolbar-hint">A simulated Microsoft Teams client &mdash; no real Teams, S-Docs, or MCP tool calls are made.</span>
  </div>

  <div class="teams-app">
    <aside class="teams-rail">
      <div class="teams-rail-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="4" fill="currentColor"/></svg>
      </div>
      <div class="teams-rail-icon" title="Activity">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </div>
      <div class="teams-rail-icon active" title="Chat">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.5 8.5 0 1 1-3.8-7.1"/><path d="M21 4l-9.5 9.5L8 10"/></svg>
        <span class="rail-badge" id="rail-badge">1</span>
      </div>
      <div class="teams-rail-icon" title="Teams">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 20v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="teams-rail-icon" title="Calendar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="teams-rail-spacer"></div>
      <div class="teams-rail-avatar">AN</div>
    </aside>

    <aside class="teams-chatlist">
      <div class="teams-chatlist-head">
        <h2>Chat</h2>
        <button class="teams-icon-btn" title="New chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="teams-search"><input type="text" placeholder="Search" disabled></div>
      <div class="teams-chatlist-section">Pinned</div>
      <div id="chat-list"></div>
    </aside>

    <main class="teams-main">
      <header class="teams-thread-header" id="thread-header"></header>

      <div class="teams-thread" id="thread"></div>

      <div class="teams-composer">
        <div class="teams-composer-box">
          <textarea class="teams-composer-input" id="composer-input" rows="1" placeholder="Reply..." disabled></textarea>
          <div class="teams-composer-row">
            <div class="teams-composer-tools">
              <button class="teams-composer-tool-btn" disabled title="Attach">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              </button>
            </div>
            <button class="teams-send-btn" id="send-btn" disabled>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M4 12l16-8-4 8 4 8-16-8z"/></svg>
            </button>
          </div>
        </div>
        <div class="teams-composer-hint">This agent responds to card actions above — replies here aren't wired up in this prototype.</div>
      </div>
    </main>
  </div>

  <div class="teams-toast-root" id="toast-root"></div>

  <script src="schema.js"></script>
  <script src="app.js"></script>
</body>
</html>
